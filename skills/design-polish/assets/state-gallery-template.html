<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>状態一覧 | design-polish</title>
<!--
  design-polish 状態一覧ページのひな形

  部品を、取りうる状態すべてで1ページに並べる。操作して状態を作らなくても、
  抜けている状態と、部品どうしで揃っていない箇所が一目で分かる。

  使い方:
    1. このファイルを複製する
    2. 【A】に対象サイトのCSSを読み込む(<link> か <style>)
    3. 【B】の例を消し、対象サイトの部品を「実際のマークアップのまま」貼る
       - 1部品 = <section class="dpg-part">、1状態 = <div class="dpg-cell">
       - ホバーとフォーカスは保持できないので、確認用クラス(.is-hover / .is-focus)を付け、
         CSS側で :hover / :focus-visible と並べて定義する
           例) .btn:hover, .btn.is-hover { ... }
       - 当てはまるのに未実装の状態は、空欄にせず class="dpg-cell dpg-missing" の枠を置く
       - モーダルなど position: fixed の部品は class="dpg-cell dpg-stage" の中に置くと枠内に収まる
    4. 【C】に切り替えスニペットを入れると、このページの上で前後を比べられる

  このページ自身の見た目は dpg- で始まるクラスだけで作ってあり、対象サイトのCSSと混ざらない。
  外部の読み込みはない。
-->

<!-- 【A】対象サイトのCSSをここに読み込む -->
<!-- <link rel="stylesheet" href="../path/to/site.css"> -->

<style>
  /* ---- 状態一覧ページ自身の枠組み(対象サイトのCSSより後に置く) ---- */
  .dpg-page {
    margin: 0; padding: 32px 20px 96px; background: #f4f2ed; color: #1d1c1a;
    font: 14px/1.7 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  }
  .dpg-wrap { max-width: 1120px; margin: 0 auto; }
  .dpg-title { font-size: 22px; line-height: 1.4; font-weight: 700; margin: 0 0 4px; color: #1d1c1a; }
  .dpg-lead { margin: 0 0 32px; color: #5c5952; }
  .dpg-part { margin: 0 0 40px; }
  .dpg-part-name {
    display: flex; align-items: baseline; gap: 12px; margin: 0 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid #d6d2c8; font-size: 16px; font-weight: 700; color: #1d1c1a;
  }
  .dpg-part-name small { font-size: 12px; font-weight: 400; color: #5c5952; }
  .dpg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .dpg-cell {
    position: relative; min-height: 112px; padding: 36px 16px 16px;
    border: 1px solid #d6d2c8; border-radius: 4px; background: #ffffff;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px;
  }
  .dpg-cell::before {
    content: attr(data-state); position: absolute; top: 8px; left: 12px;
    font: 600 11px/1.4 system-ui, sans-serif; color: #5c5952; letter-spacing: 0;
  }
  .dpg-wide { grid-column: 1 / -1; align-items: stretch; }
  /* position: fixed の部品を枠内に収める */
  .dpg-stage { transform: translateZ(0); min-height: 360px; overflow: hidden; grid-column: 1 / -1; align-items: stretch; }
  .dpg-missing { border-style: dashed; background: transparent; }
  .dpg-missing::after { content: "未実装"; color: #8a3b12; font: 600 12px/1.4 system-ui, sans-serif; }
</style>
</head>
<body class="dpg-page">
<div class="dpg-wrap">
  <h1 class="dpg-title">状態一覧</h1>
  <p class="dpg-lead">部品を全状態で並べたページ。共通層のCSSを直したら、まずここで確かめる。</p>

  <!-- 【B】ここから下を、対象サイトの部品に置き換える ------------------------ -->

  <section class="dpg-part">
    <h2 class="dpg-part-name">主ボタン <small>例:保存、送信</small></h2>
    <div class="dpg-grid">
      <div class="dpg-cell" data-state="通常"><button type="button">保存する</button></div>
      <div class="dpg-cell" data-state="ホバー"><button type="button" class="is-hover">保存する</button></div>
      <div class="dpg-cell" data-state="フォーカス"><button type="button" class="is-focus">保存する</button></div>
      <div class="dpg-cell" data-state="無効"><button type="button" disabled>保存する</button></div>
      <div class="dpg-cell" data-state="読み込み中"><button type="button" aria-busy="true" disabled>保存しています</button></div>
    </div>
  </section>

  <section class="dpg-part">
    <h2 class="dpg-part-name">入力欄 <small>例:テキスト、選択</small></h2>
    <div class="dpg-grid">
      <div class="dpg-cell" data-state="通常(空)"><label for="dpg-i1">会社名</label><input id="dpg-i1" type="text" placeholder="例:山田商店"></div>
      <div class="dpg-cell" data-state="入力済み"><label for="dpg-i2">会社名</label><input id="dpg-i2" type="text" value="山田商店"></div>
      <div class="dpg-cell" data-state="フォーカス"><label for="dpg-i3">会社名</label><input id="dpg-i3" type="text" class="is-focus" value="山田商店"></div>
      <div class="dpg-cell" data-state="無効"><label for="dpg-i4">会社名</label><input id="dpg-i4" type="text" value="山田商店" disabled></div>
      <div class="dpg-cell" data-state="エラー"><label for="dpg-i5">会社名</label><input id="dpg-i5" type="text" aria-invalid="true" aria-describedby="dpg-e5"><p id="dpg-e5">会社名を入力してください。</p></div>
    </div>
  </section>

  <section class="dpg-part">
    <h2 class="dpg-part-name">表・一覧 <small>例:検索結果</small></h2>
    <div class="dpg-grid">
      <div class="dpg-cell dpg-wide" data-state="通常">
        <table>
          <thead><tr><th>案件名</th><th>担当</th><th>期限</th></tr></thead>
          <tbody><tr><td>店舗サイト改修</td><td>佐藤</td><td>12/05</td></tr><tr><td>請求書テンプレート</td><td>田中</td><td>12/12</td></tr></tbody>
        </table>
      </div>
      <div class="dpg-cell dpg-wide" data-state="空"><p>条件に合う案件はありません。絞り込みを解除するか、新しい案件を登録してください。</p></div>
      <div class="dpg-cell dpg-wide" data-state="読み込み中"><p aria-busy="true">案件を読み込んでいます。</p></div>
      <div class="dpg-cell dpg-wide" data-state="エラー"><p role="alert">案件を読み込めませんでした。通信状況を確かめて、もう一度お試しください。</p></div>
    </div>
  </section>

  <section class="dpg-part">
    <h2 class="dpg-part-name">モーダル <small>重ねて表示する部品は dpg-stage に置く</small></h2>
    <div class="dpg-grid">
      <div class="dpg-cell dpg-stage" data-state="開いた状態">
        <!-- 対象サイトのモーダルを、開いた状態のマークアップで置く -->
        <div role="dialog" aria-modal="true" aria-labelledby="dpg-m1">
          <h3 id="dpg-m1">案件を削除しますか</h3>
          <p>削除すると元に戻せません。</p>
          <button type="button">キャンセル</button> <button type="button">削除する</button>
        </div>
      </div>
      <div class="dpg-cell dpg-missing" data-state="読み込み中"></div>
    </div>
  </section>

  <!-- 【B】ここまで ------------------------------------------------------------ -->
</div>

<!-- 【C】切り替えスニペット(任意)。共通層のCSSをこのページの上でオン・オフする -->
<!-- <script src="toggle-snippet.js" data-polish-href="polish.css"></script> -->
</body>
</html>
